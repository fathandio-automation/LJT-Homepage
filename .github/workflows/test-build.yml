name: Test site build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        run: bundle install

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Show publications order
        run: |
          echo "=== publication titles in render order ==="
          grep -o 'archive__item-title[^>]*>.*</a>' _site/publications/index.html | sed 's/<[^>]*>//g' | head -10
          echo "=== Published in lines ==="
          grep -o "Published in <i>[^<]*</i>[^<]*" _site/publications/index.html

      - name: Show single publication page
        run: |
          echo "=== synlogic page ==="
          grep -o "Published in <i>[^<]*</i>[^<]*" _site/publication/synlogic/index.html || true
          grep -o "Recommended citation: [^<]*" _site/publication/synlogic/index.html | head -1
          echo "=== check date on single page ==="
          grep -n "2025-01-01\|January 1\|1900" _site/publication/synlogic/index.html || echo "no fabricated date"
