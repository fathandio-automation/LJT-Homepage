name: Test site build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        run: bundle install

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Verify publications page
        run: |
          echo "=== titles found on publications page ==="
          grep -o "SynLogic[^<\"]*" _site/publications/index.html | head -3
          grep -o "Perception Bottleneck[^<\"]*" _site/publications/index.html | head -3
          grep -o "Universal Truthfulness Hyperplane[^<\"]*" _site/publications/index.html | head -3
          grep -o "In-Context Sharpness[^<\"]*" _site/publications/index.html | head -3
          grep -o "C-Eval[^<\"]*" _site/publications/index.html | head -3
          grep -o "Composing Parameter-Efficient[^<\"]*" _site/publications/index.html | head -3
          echo "=== Published in lines ==="
          grep -o "Published in <i>[^<]*</i>[^<]*" _site/publications/index.html
          echo "=== check for 1900 placeholder ==="
          (grep -n "1900" _site/publications/index.html && echo "FOUND 1900") || echo "no 1900 placeholder"

      - name: Verify about page
        run: |
          echo "=== about page checks ==="
          grep -c "Junteng Liu" _site/index.html
          grep -o "Zhiyuan Honor Scholarship" _site/index.html
          grep -o "HKUST NLP Group" _site/index.html | head -2
          grep -o "jliugi@connect.ust.hk" _site/index.html
          grep -o "SynLogic[^<\"]*" _site/index.html | head -2
          echo "=== check for template placeholders ==="
          (grep -n "Your Name" _site/index.html && echo "FOUND Your Name") || echo "no Your Name placeholder"
          (grep -n "Red Brick University" _site/index.html && echo "FOUND Red Brick") || echo "no Red Brick placeholder"
