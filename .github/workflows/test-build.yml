name: Test site build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        run: bundle install

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Comprehensive checks
        run: |
          echo "=== About page sections ==="
          grep -o "About Me\|Academic Background\|Research Experience\|Publications\|Contact" _site/index.html | sort | uniq -c
          echo "=== Key facts on about page ==="
          for term in "Junteng Liu" "HKUST NLP Group" "Junxian He" "Shanghai Jiao Tong University" "June 2024" "Zhiyuan Honor Scholarship" "MINIMAX" "February 2025" "Tencent WXG" "September 2024" "Shanghai AI Lab" "December 2023" "Zifei Shan" "Yu Cheng" "LLM Reasoning" "Hallucination" "truthfulness" "SynLogic" "Perception Bottleneck" "Universal Truthfulness Hyperplane" "In-Context Sharpness" "C-Eval" "Composing Parameter-Efficient" "jliugi@connect.ust.hk" "Vicent0205" "tbK9jl4AAAAJ" "junteng88716710"; do
            grep -q "$term" _site/index.html && echo "OK: $term" || echo "MISSING: $term"
          done
          echo "=== Placeholder scan across site ==="
          for term in "Your Name" "Red Brick" "Paper Title Number" "yourorcidurl" "none@example.org" "bsky.app" "john+snow" "profile.png"; do
            grep -rn "$term" _site/ && echo "FOUND PLACEHOLDER: $term" || echo "clean: $term"
          done
          echo "=== Nav check (only Publications) ==="
          grep -o 'href="[^"]*publications/"' _site/index.html | head -2
          grep -c 'Talks\|Teaching\|Portfolio\|Guide' _site/index.html || echo "no extra nav"
          echo "=== Publications page all six ==="
          for term in "SynLogic" "Perception Bottleneck" "Universal Truthfulness Hyperplane" "In-Context Sharpness" "C-Eval" "Composing Parameter-Efficient"; do
            grep -q "$term" _site/publications/index.html && echo "OK: $term" || echo "MISSING: $term"
          done
